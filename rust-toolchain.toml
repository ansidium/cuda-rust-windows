# Stable pin for the git-root host workspace (cuda-bindings, cuda-core,
# cuda-core-derive, cuda-async). rustup walks up from the working directory,
# so `cargo` at the git root agrees with the Oxide toolchain under
# cuda-oxide/. Keep this channel in lockstep with cutile-rs/rust-toolchain.toml.
[toolchain]
channel = "stable"
components = [
    "rust-src",
    "rustc-dev",
    "rust-analyzer",
    "clippy",
    "rustfmt",
    "llvm-tools",
]
