[package]
name = "disjoint_slice_len"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.cuda-oxide]
extra-rustflags = ["-Zinline-mir=no"]

[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = { path = "../../../../../cuda-core", version = "0.4.0" }

# The mir-importer intercepts `DisjointSlice::len` only when rustc's MIR
# inliner leaves the call intact; at default release settings the call is
# inlined into the kernel and the issue #343 pattern this example guards
# disappears. cargo-oxide reads the package metadata and applies the flag only
# to this example's codegen invocation, keeping the shared dependency tree
# identical to every other example.
